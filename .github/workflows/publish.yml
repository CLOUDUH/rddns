# Publishing is deliberately manual and builds a downloadable image artifact.
# The historical workflow targeted NewFuture's registries; it must not be reused.
name: Package Docker image
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rddns:web .
      - run: docker save rddns:web | gzip > rddns-web.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rddns-web-docker-image
          path: rddns-web.tar.gz
          retention-days: 7
