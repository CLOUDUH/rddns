# Linux / NAS host networking improves SSDP discovery. Use instead of compose.yaml.
services:
  rddns:
    container_name: rddns
    build:
      context: .
      args:
        PIP_INDEX_URL: ${RDDNS_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    network_mode: host
    volumes:
      - rddns-data:/data
    environment:
      RDDNS_HOST: ${RDDNS_BIND_IP:-127.0.0.1}
      RDDNS_PORT: 8080
      RDDNS_ADMIN_PASSWORD: ${RDDNS_ADMIN_PASSWORD:-admin}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  rddns-data:
