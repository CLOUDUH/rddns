services:
  rddns:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${RDDNS_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    ports:
      - "${RDDNS_BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - rddns-data:/data
    environment:
      RDDNS_ADMIN_PASSWORD: ${RDDNS_ADMIN_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  rddns-data:
