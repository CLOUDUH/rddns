services:
  rddns:
    container_name: rddns
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${PORT:-8080}
    volumes:
      - rddns-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  rddns-data:
