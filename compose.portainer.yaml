# Portainer > Stacks > Add stack > Repository (Docker Standalone on Linux/NAS)
# Required environment variable: NAS_IP = Docker host's LAN IPv4 address.
services:
  rddns:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${RDDNS_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    network_mode: host
    environment:
      RDDNS_HOST: ${NAS_IP:?Set NAS_IP to the Docker host LAN IPv4 address}
      RDDNS_PORT: ${RDDNS_PORT:-8080}
      RDDNS_ADMIN_PASSWORD: ${RDDNS_ADMIN_PASSWORD:-}
    volumes:
      - rddns-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  rddns-data:
